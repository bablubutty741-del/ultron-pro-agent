
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b12">
<title>ULTRON PRO TRINITY</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090b12;color:#fff;
 font-family:Arial,sans-serif;min-height:100vh;
 display:flex;flex-direction:column
}
header{
 padding:20px;text-align:center;
 background:#121725;border-bottom:1px solid #ed343f
}
h1{color:#ff4b55;letter-spacing:3px;margin:0}
small{color:#aab4c8}
main{
 width:100%;max-width:850px;margin:auto;
 padding:18px;flex:1;display:flex;
 flex-direction:column;gap:16px
}
.status{text-align:center;color:#56e5a2}
.core{
 width:130px;height:130px;border-radius:50%;
 margin:8px auto;background:radial-gradient(circle,#ff4855,#65121d,#101522);
 box-shadow:0 0 35px #e7354770;
 display:grid;place-items:center;font-size:38px;
 animation:pulse 2s infinite
}
@keyframes pulse{
 50%{box-shadow:0 0 55px #ed394a}
}
#messages{
 flex:1;min-height:250px;max-height:48vh;
 overflow-y:auto;display:flex;flex-direction:column;gap:12px
}
.msg{
 padding:13px;border-radius:12px;
 max-width:90%;white-space:pre-wrap;line-height:1.5
}
.user{background:#762b37;align-self:flex-end}
.bot{background:#1b2638;align-self:flex-start}
.controls{display:flex;gap:8px;flex-wrap:wrap}
input{
 flex:1;min-width:150px;padding:15px;
 border-radius:12px;border:1px solid #39465d;
 background:#151d2c;color:white;font-size:16px
}
button{
 border:0;border-radius:10px;padding:13px 16px;
 background:#e63c4a;color:white;font-weight:bold;
 cursor:pointer
}
button.secondary{background:#26364d}
button:disabled{opacity:.5}
footer{text-align:center;padding:15px;color:#8592a8;font-size:12px}
</style>
</head>
<body>
<header>
<h1>ULTRON PRO</h1>
<small>TRINITY INTELLIGENCE · JARVIS × ULTRON × VISION</small>
</header>

<main>
<div class="status" id="status">● Checking AI system...</div>
<div class="core">U</div>
<div id="messages">
<div class="msg bot">Namaste! Main ULTRON PRO TRINITY hoon. Aap mujhse Hindi ya English mein baat kar sakte hain.</div>
</div>

<div class="controls">
<input id="question" placeholder="Ask ULTRON anything..." autocomplete="off">
<button id="send">SEND</button>
<button class="secondary" id="mic">🎤</button>
<button class="secondary" id="speak">🔊 ON</button>
</div>
</main>
<footer>ULTRON PRO TRINITY · Your AI Assistant</footer>

<script>
const messages = document.getElementById("messages");
const question = document.getElementById("question");
const statusBox = document.getElementById("status");
const sendBtn = document.getElementById("send");
const micBtn = document.getElementById("mic");
const speakBtn = document.getElementById("speak");

let history = [];
let voiceEnabled = true;

function addMessage(text, type) {
 const el = document.createElement("div");
 el.className = "msg " + type;
 el.textContent = text;
 messages.appendChild(el);
 messages.scrollTop = messages.scrollHeight;
}

async function checkSystem() {
 try {
  const r = await fetch("/api/health");
  const data = await r.json();
  statusBox.textContent = data.aiConfigured
   ? "● ULTRON SYSTEM ONLINE"
   : "● SERVER ONLINE · API KEY REQUIRED";
 } catch {
  statusBox.textContent = "● SERVER CONNECTION UNAVAILABLE";
 }
}

function speak(text) {
 if (!voiceEnabled || !("speechSynthesis" in window)) return;
 window.speechSynthesis.cancel();
 const utterance = new SpeechSynthesisUtterance(text);
 utterance.lang = "hi-IN";
 window.speechSynthesis.speak(utterance);
}

async function sendMessage() {
 const text = question.value.trim();
 if (!text || sendBtn.disabled) return;

 question.value = "";
 addMessage(text, "user");
 history.push({role:"user", content:text});
 sendBtn.disabled = true;
 statusBox.textContent = "● ULTRON IS THINKING...";

 try {
  const response = await fetch("/api/chat", {
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({messages:history})
  });

  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "Request failed");

  const reply = data.reply || "No reply received.";
  history.push({role:"assistant", content:reply});
  addMessage(reply, "bot");
  speak(reply);
  statusBox.textContent = "● ULTRON SYSTEM ONLINE";

 } catch(error) {
  addMessage("Connection error: " + error.message, "bot");
  history.pop();
  statusBox.textContent = "● CHECK SERVER / API CONFIGURATION";
 } finally {
  sendBtn.disabled = false;
  question.focus();
 }
}

sendBtn.addEventListener("click", sendMessage);
question.addEventListener("keydown", e => {
 if(e.key === "Enter") sendMessage();
});

speakBtn.addEventListener("click", () => {
 voiceEnabled = !voiceEnabled;
 speakBtn.textContent = voiceEnabled ? "🔊 ON" : "🔇 OFF";
 if(!voiceEnabled && "speechSynthesis" in window)
  window.speechSynthesis.cancel();
});

const SpeechRecognition =
 window.SpeechRecognition || window.webkitSpeechRecognition;

if(SpeechRecognition) {
 const recognition = new SpeechRecognition();
 recognition.lang = "hi-IN";
 recognition.interimResults = false;

 micBtn.addEventListener("click", () => {
  try {
   recognition.start();
   statusBox.textContent = "● LISTENING...";
  } catch {
   statusBox.textContent = "● MICROPHONE BUSY";
  }
 });

 recognition.onresult = event => {
  question.value = event.results[0][0].transcript;
  sendMessage();
 };
 recognition.onerror = () => {
  statusBox.textContent = "● MICROPHONE ERROR";
 };
 recognition.onend = checkSystem;
} else {
 micBtn.disabled = true;
 micBtn.textContent = "MIC N/A";
}

checkSystem();
</script>
</body>
  </html>
